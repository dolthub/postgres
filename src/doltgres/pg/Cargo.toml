# The `pg` crate: the simulation's libzstd and its allocator.

[package]
name = "pg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Links the libzstd Postgres links into a test binary built without Postgres, and lets a test fail allocations.
outside_postgres = []

[build-dependencies]
bindgen = { version = "0.73.2", default-features = false, features = ["runtime"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
undocumented_unsafe_blocks = "deny"
