# The `sim` crate: the simulation's host, `host`'s seams over the real file system with Doltgrust's storage simulation
# of crashes and full disks, for the storage crates' tests; never linked into `postgres` (design item 14).

[package]
name = "sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
host = { path = "../host", features = ["testing"] }
pg = { path = "../pg", features = ["outside_postgres"] }

# The pin table's failed-allocation case fails every allocation of its process, so it runs without the test harness's
# threads.
[[test]]
name = "pin_table_growth"
harness = false

[lints]
workspace = true
