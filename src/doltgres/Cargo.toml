# The fork's Cargo workspace (design item 11): the test-only Rust, `sim` and `simc` with the `host` and `pg` crates
# they build on.

[workspace]
members = ["host", "pg", "sim", "simc"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"

# The release profile: whole-program optimization for builds without assertions.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"

# The profile of assert-enabled builds: optimized, with debug assertions and overflow checks, without whole-program
# optimization.
[profile.cassert]
inherits = "release"
lto = false
codegen-units = 16
debug-assertions = true
overflow-checks = true
