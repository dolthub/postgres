# The btree differential's generator (the btree text's section 3): records Doltgrust's keys and values of a
# non-unique index's entries, at 9b345931d, over the corpus in src/main.rs, into ../expected.tsv. run.sh builds it in
# a scratch directory beside a read-only extract of Doltgrust at that commit, `../doltgrust/`, outside the fork's
# workspace.

[package]
name = "btree-corpus"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
types = { path = "../doltgrust/crates/types" }
nodes = { path = "../doltgrust/crates/nodes" }
encoding = { path = "../doltgrust/crates/encoding" }

# Doltgrust's own patches of its workspace root, which a crate built outside that workspace doesn't inherit.
[patch.crates-io]
icu_collator = { path = "../doltgrust/third_party/icu_collator" }
libmimalloc-sys = { path = "../doltgrust/third_party/libmimalloc-sys" }
pg_query = { path = "../doltgrust/third_party/pg_query" }
