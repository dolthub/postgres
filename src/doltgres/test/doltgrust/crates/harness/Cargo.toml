# The fork's form of Doltgrust's crates/harness/Cargo.toml at 1cc06b328cd9: the same crate and dependencies but for
# Doltgrust's engine crates (nodes, parser, cache, and types), whose three uses the fork replaces with pg_query, which
# parses with Postgres' own grammar, and encoding_rs.

[package]
name = "harness"
description = "Test harness that drives a doltgrust server, or a real Postgres, over the wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
encoding_rs = "0.8"
mio = { version = "1", features = ["net", "os-poll"] }
pg_query = "18.1"
pgproto.workspace = true
rustls = "0.23"
sha2 = "0.10"
socket2 = "0.6"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }

[lints]
workspace = true
