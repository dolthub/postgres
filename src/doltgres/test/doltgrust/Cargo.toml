# The workspace of Doltgrust's tests copied into the fork (README.md): its own, apart from the fork's Rust workspace,
# giving the copied manifests the workspace settings Doltgrust's root gives them, so they build unchanged against the
# fork's harness.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.dependencies]
pgproto = { path = "crates/pgproto" }

# Doltgrust's quick profile, which its CI builds its tests with: the release profile with incremental builds and
# debug assertions.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug-assertions = true
