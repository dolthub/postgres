# The one definition of the frontend program's builds' cfg (design item D12): every cargo run in this folder, whether
# cargo.pl's build-frontend or a gate's step, builds pg, host, and chunks with `doltgres_frontend`, which leaves out the
# server's items and puts in the frontend's.

[build]
rustflags = ["--cfg", "doltgres_frontend"]
# rustdoc, which builds the doctests, takes the same cfg, so they build the frontend's items too.
rustdocflags = ["--cfg", "doltgres_frontend"]
