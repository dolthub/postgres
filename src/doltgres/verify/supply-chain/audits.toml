[[audits.vstd]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
version = "0.0.0-2026-11-01-0251"
notes = "Verus' standard library of specifications and proofs. build.rs only sets RUST_MIN_STACK for rustc when unset. The 33 unsafe blocks are in raw_ptr, simple_pptr, cell, pcell, pcell_maybe_uninit, and atomic, safe-signature functions whose soundness rests on Verus-checked tracked permissions, so they're sound only when called from verified code, and thread, hash_map, and hash_set wrap std's threads and hash maps; the fork's typed lint lets its crates call only the vstd functions verify/lint/vstd-allowed.list names. No file or network use; thread.rs and raw_ptr.rs abort the process on allocation or spawn failure."

[[audits.xxhash-rust]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
version = "0.8.19"
notes = "Pure Rust hashing with no build script, no dependencies, and no I/O. The unsafe is pointer reads and copies: utils.rs's chunk readers (bounds held by each caller's length arithmetic and checked by debug assertions), references cast only to u8 arrays (alignment 1) except xxh32 and xxh64's aligned path, which reads only their own u32- or u64-aligned buffers, the streaming buffers' copies, MaybeUninit secret initialization, and SIMD loads of fixed-size stripes behind target-feature cfgs."

