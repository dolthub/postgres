notes = "Derived Default (const under the nightly feature), wrapping_mul in multiply_mix with a widened 64-bit cfg, an equivalent split_first_chunk bulk loop, and rand 0.9 for the optional random state; no unsafe."

[[audits.stable_deref_trait]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
version = "1.2.1"
notes = "Two unsafe marker traits, StableDeref and CloneStableDeref, and their impls for std's owning pointers, guards, and references (Box, Vec, String, the owned C, OS, and path strings, Cow of the borrowed forms, Rc, Arc, Ref, RefMut, the lock guards, & and &mut). No functions, no dependencies, no build script."

[[audits.verus_builtin]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
version = "0.0.0-2026-11-01-0251"
notes = "Verus' marker types and traits, no build script and no I/O. The uninitialized values and null references in Ghost and Tracked's view, get, and borrow are compiled only under cfg(verus_keep_ghost), the verifier's own build, never in a normal one; Ghost and Tracked are PhantomData wrappers, and the unsafe impls are marker traits (Structural, Integer, and Send and Sync on those zero-sized wrappers)."

[[audits.verus_builtin_macros]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
version = "0.0.0-2026-11-01-0251"
notes = "The verus! procedural macros, rewriting and erasing Verus syntax through verus_syn. They read only the VSTD_KIND and CARGO_PKG_NAME variables, do no file, network, or process work, and contain no unsafe code; the unsafe blocks they emit (a zeroed placeholder and calls of unsafe callees the user wrote) land in the calling crate, whose own unsafe checks see them. The off-by-default contrib-hooks feature includes a file named by VERUS_CONTRIB_HOOKS_FILE. Its Structural derive also emits an unsafe impl into the calling crate."

