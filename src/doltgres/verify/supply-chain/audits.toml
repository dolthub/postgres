
# cargo-vet audits file

[[audits.bindgen]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
delta = "0.73.1 -> 0.73.2"
notes = "Struct-layout and bitfield-unit padding reworked (pad_to_offset, unit offsets, inner layouts of typedefs and enums), and bitfield accessors now generated through transmute in unsafe blocks. No new I/O or process use. The generated layouts are checked by the layout tests pg compiles."

[[audits.bitflags]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
delta = "2.11.1 -> 2.13.2"
notes = "Macro machinery for #[bitflags(flag_name)] renaming, an IterEqualNames iterator, and lint allowances; the crate stays forbid(unsafe_code) outside its optional bytemuck impls."

[[audits.cfg-if]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
delta = "1.0.4 -> 1.0.5"
notes = "Documentation only: a deprecation note in the README and crate docs, version bumps, and CI pins."

[[audits.clang-sys]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
version = "1.9.1"
notes = "libclang FFI declarations. With the runtime feature, build.rs does nothing. At run time it finds libclang by running llvm-config, xcode-select, and clang (to read versions and include paths) and loads it with libloading. No network, and no file writes. Default impls zero FFI structs whose function-pointer fields are all Option, and is_executable calls access()."

[[audits.glob]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
delta = "0.3.3 -> 0.3.4"
notes = "Edition 2021, a From<GlobError> for io::Error impl, filename caching in fill_todo's sort, and tests moved from tempdir to tempfile; no unsafe, no new file or process access."

[[audits.libc]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
delta = "0.2.190 -> 0.2.191"
notes = "Declarations only: new constants and structs (Apple ifaliasreq and in6_aliasreq, FreeBSD PT_*, Haiku AI_*/NI_*, Hurd POSIX_SPAWN_*), layout fixes (FreeBSD aarch64 regs, AIX statvfs, Emscripten cfgs), and the deprecated Mach declarations widened to all Apple targets. build.rs only adds Emscripten version cfgs."

[[audits.libloading]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
delta = "0.9.0 -> 0.8.9"
notes = "Back to the 0.8 API: &[u8] and AsRef<OsStr> names through cstr_cow_from_bytes, which keeps the CString alive across dlopen and dlsym, and the same with_dlerror handling. The unsafe blocks are the documented dlopen/dlsym/dlclose and LoadLibraryExW/GetProcAddress FFI."

[[audits.minimal-lexical]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
version = "0.2.1"
notes = "Float parsing (Lemire, Bellerophon, and big-integer slow paths) with tables. No I/O, process, or environment use. asm! is only behind the nightly feature on x86 without SSE2. The unsafe blocks are bounds-checked table reads behind exponent checks, and StackVec/HeapVec length operations guarded by capacity checks (shl_limbs, extend, resize)."

[[audits.rustc-hash]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
delta = "2.1.1 -> 2.1.3"
notes = "Derived Default (const under the nightly feature), wrapping_mul in multiply_mix with a widened 64-bit cfg, an equivalent split_first_chunk bulk loop, and rand 0.9 for the optional random state; no unsafe."

