[[audits.blake3]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
version = "1.8.7"
notes = "build.rs reads only Cargo's target variables, CC, and CFLAGS (appending -fno-lto), probes the C compiler's AVX-512 flags, compiles the crate's own x86-64 assembly or C intrinsics and blake3_neon.c with cc, and on Windows targets built without MSVC's assembler removes stray .asm files from the crate folder. The assembly kernels make no calls or system calls and touch only the pointers passed in; the C files include only standard headers and intrinsics. In Rust, SIMD paths run only after runtime detection (cpufeatures on x86) or a NEON build, the C wrappers assert the output length before each call, and ffi_neon.rs exports the portable compress function unmangled for blake3_neon.c. File access is only in the optional mmap feature's update_mmap and the tests; there's no network, process, or environment use at run time. It also reads BLAKE3_CI, which makes its warnings fail the build, and, when cross-compiling for MSVC, the target's own CC_ variable."

[[audits.cc]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
delta = "1.2.5 -> 1.11.1"
notes = "A build-time crate that runs C compilers by design. New in this range: Windows tool discovery moved to find-msvc-tools; a parallel runner with a poll-based reactor and a jobserver client that takes the pipe, fifo, or semaphore Cargo passes in CARGO_MAKEFLAGS (its unsafe borrows that inherited fd, makes and flags its own pipe, and opens the named semaphore); a C++ standard-library probe that compiles a bundled two-line file in the output folder; an optional compile_commands.json writer; a logger; more build-environment variables read with target prefixes; and the generated target table. Commands run are the configured compilers, archivers, and rustc in its target-list tests (behind a test cfg). Files written stay in OUT_DIR. No network."

[[audits.cfg-if]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
delta = "1.0.4 -> 1.0.5"
notes = "Documentation only: a deprecation note in the README and crate docs, version bumps, and CI pins."

[[audits.clang-sys]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
version = "1.9.1"
notes = "libclang FFI declarations. With the runtime feature, build.rs does nothing. At run time it finds libclang by running llvm-config, xcode-select, and clang (to read versions and include paths) and loads it with libloading. No network, and no file writes. Default impls zero FFI structs whose function-pointer fields are all Option, and is_executable calls access()."

[[audits.constant_time_eq]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
delta = "0.3.1 -> 0.4.2"
notes = "Rewritten into generic, classic, SSE2, and NEON comparisons, each loading only from slices whose length is asserted first, with inline asm only to hide values from the optimizer and to compare and mask vector registers (pure, nomem). On aarch64, dit.rs sets the DIT bit (and a speculation barrier) around a comparison when runtime detection finds the feature, restoring the saved bit through a drop guard; the cached feature byte is transmuted only from values the crate stored. No I/O, no build script."

[[audits.elsa]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
version = "1.11.2"
notes = "Read whole without the indexmap feature, which the fork doesn't enable. map.rs (FrozenMap and FrozenBTreeMap, what trees' pin uses): every &self operation that can run a caller's Hash, Eq, Ord, Clone, PartialEq, or closure sets an in_use flag and asserts it clear first, so a re-entrant call panics instead of aliasing the map; values are only added through &self (entry().or_insert), never removed or replaced, and references are handed out to V::Target under StableDeref, so they outlive a rehash; a panic in caller code leaves the flag set, which fails later calls safely. Three parts are NOT sound for every caller, and the fork refuses them with doors: vec.rs's FrozenVec has no such flag, so its Clone and PartialEq run the element's code while the vector is borrowed, and an element that reaches its own vector can push under them; sync.rs's LockFreeFrozenVec is Send and Sync for every Copy element, including ones that aren't Sync, and its Clone reads whole buffers, initialized or not, while another thread may push; sync.rs's lock-based types were read only for their shape (a lock held for each operation, the same lifetime extension). No I/O, no process use, no build script; its one dependency is stable_deref_trait."

