[[audits.find-msvc-tools]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
version = "0.1.15"
notes = "cc 1.2.5's windows module (audited there) split into its own crate: the COM, registry, and Visual Studio setup-configuration bindings are unchanged but for paths; new are a Tool type that builds a Command for a found compiler, hand-written kernel32 bindings, and a check of AMD64 emulation that loads GetMachineTypeAttributes from kernel32.dll with a signature checked at compile time. It reads registry keys, VS instance data, and environment variables, lists SDK folders, and runs vswhere-style queries only to find tools; it writes nothing and uses no network."

[[audits.generativity]]
who = "Daylon Wilkins <daylon@dolthub.com>"
criteria = "safe-to-deploy"
version = "1.2.1"
notes = "One file, no_std, no dependencies, no build script. Id, Guard, and LifetimeBrand are zero-sized markers over PhantomData; the three unsafe fns only construct them. make_guard! is the safe way in: it ties the brand's lifetime to a local with drop glue, so two guards can't share a lifetime, and ends with a never-taken `if let Some(x) = None { return x; }` that keeps the drop reachable when the code after it diverges. It expands three unsafe blocks into the calling crate, which the fork's expanded-source check lists in macros.tsv."

