# The Rust toolchain every build of the fork uses (design item 18), read by rustup from this directory.

[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt", "llvm-tools"]
profile = "minimal"
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
