# The `simc` crate: the C port's test crate (the port text's section 13), never linked into `postgres`. It exports the
# simulation's host as the C port's host table and `sim`'s test API as `extern "C"` functions, a static library the C
# tests' modules link. With the binding crate and the shared-memory crate, it is one of the three crates allowed
# `unsafe`, for its calls across the C boundary.

[package]
name = "simc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
host = { path = "../host", features = ["testing"] }
sim = { path = "../sim" }

[build-dependencies]
bindgen = { version = "0.73.2", default-features = false, features = ["runtime"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
undocumented_unsafe_blocks = "deny"
